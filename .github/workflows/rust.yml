name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: build
      run: cargo build --all-targets
    - name: test
      run: cargo test
    - name: lint
      run: cargo clippy --all-targets -- -D warnings
    - name: format
      run: cargo fmt --check
    - name: license headers
      run: make check-gpl
